apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: a7-amf-memory-stress-high
  namespace: open5gs
spec:
  mode: all
  selector:
    namespaces:
      - open5gs
    labelSelectors:
      app.kubernetes.io/name: amf
  stressors:
    memory:
      workers: 1
      size: "300MB"
  duration: "180s"
