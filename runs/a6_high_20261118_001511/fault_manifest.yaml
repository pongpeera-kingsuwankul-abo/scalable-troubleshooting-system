apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: a6-amf-cpu-stress-high
  namespace: open5gs
spec:
  mode: all
  selector:
    namespaces:
      - open5gs
    labelSelectors:
      app.kubernetes.io/name: amf
  stressors:
    cpu:
      workers: 2
      load: 100
  duration: "180s"
