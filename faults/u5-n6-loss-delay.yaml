# U5 — N6 loss / delay (UPF exit to the internet)
# Adds 200ms latency + 30% packet loss on the N6 link between the UPF and
# the data network (n6-server).
#
# The fault is injected at the n6-server end of the link, not on the UPF pod:
# Chaos Mesh shapes only traffic a pod sends itself, and the UPF forwards
# user traffic rather than sending it, so a rule on the UPF pod has no effect
# on UE traffic (checked 2026-11-16: injected fine, ping unchanged).
#
# action "netem" is the Chaos Mesh action that combines delay and loss.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: u5-n6-loss-delay
  namespace: open5gs
spec:
  action: netem
  mode: all
  selector:
    namespaces:
      - open5gs
    labelSelectors:
      app: n6-server
  delay:
    latency: "200ms"
    jitter: "20ms"
    correlation: "50"
  loss:
    loss: "30"
    correlation: "0"
  direction: to
  duration: "120s"
