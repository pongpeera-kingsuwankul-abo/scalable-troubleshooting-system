apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-smf
  namespace: open5gs
data:
  smf.yaml: |
    logger:
      level: info
    global: null
    smf:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp-sbi:7777
      pfcp:
        server:
          - dev: eth0
        client:
          upf:
            - address: open5gs-upf-pfcp
      gtpc:
        server:
          - dev: eth0
      gtpu:
        server:
          - dev: eth0
      session:
        - dnn: internet
          subnet: 10.45.0.1/30
      dns:
        - 8.8.8.8
        - 8.8.4.4
        - 2001:4860:4860::8888
        - 2001:4860:4860::8844
      mtu: 1400
      ctf:
        enabled: auto
      metrics:
        server:
          - address: 0.0.0.0
            port: 9090
